<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResellerHub — Reseller &amp; Agent System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
/* ResellerHub design system: electric blue, white, lime; bold sans; pills */
:root{
  --blue:#0012E6;--blue-ink:#020DBD;--blue-action:#1F46EF;--lime:#CEFC36;--lime-soft:#EEFDB8;
  --bg:#F0F2FC;--card:#FFFFFF;--ink:#0B1250;--ink2:#2A3270;--muted:#525A8C;--line:#DCE1F7;--line2:#EBEEFB;
  --brand:var(--blue);--brand-d:var(--blue-ink);--brand-l:#E3E6FD;--accent:var(--lime);--accent-l:var(--lime-soft);
  --ok:#2E5B00;--ok-l:var(--lime-soft);--warn:#8A4B00;--warn-l:#FFF0D6;--err:#B42318;--err-l:#FDE7E5;--info:var(--blue-ink);--info-l:#E3E6FD;
  --r:20px;--sh:0 1px 2px rgba(11,18,80,.04),0 8px 24px rgba(2,13,189,.06);--lift:0 10px 30px rgba(2,13,189,.18);
  --mono:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 14.5px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-action);font-weight:700}
.muted{color:var(--muted)}.sm{font-size:12.5px}.num{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
[hidden]{display:none!important}

/* buttons & inputs: pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);background:var(--card);padding:8px 18px;border-radius:999px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.15s;color:var(--blue-ink)}
.btn:hover{border-color:var(--blue-action)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-ink);border-color:var(--blue-ink)}
.btn.accent{background:var(--lime);border-color:var(--lime);color:var(--blue-ink)}.btn.accent:hover{filter:brightness(.96)}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.ghost{background:transparent}
.btn.xs{padding:4px 12px;font-size:12.5px;border-width:1.5px}
.btn.block{width:100%;padding:12px 18px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.in:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.in,select.in,textarea.in{width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 13px;outline:none;transition:.15s}
.in:focus{border-color:var(--blue-action);box-shadow:0 0 0 4px var(--brand-l)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0 12px;font-weight:700}
input[type=checkbox],input[type=radio]{accent-color:var(--blue)}

/* auth: the promo look */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-hero{background:var(--blue);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-hero:before{content:"";position:absolute;right:-90px;bottom:-140px;width:520px;height:300px;border-radius:50%;background:rgba(255,255,255,.08);transform:rotate(-12deg)}
.auth-hero h1{font-size:52px;line-height:.98;letter-spacing:-.035em;max-width:520px;color:#fff;position:relative}
.auth-hero h1 em{color:var(--lime);font-style:italic;letter-spacing:-.045em;display:inline-block;position:relative}
.auth-hero h1 em:after{content:"";position:absolute;left:4%;right:6%;bottom:-8px;height:6px;border-radius:999px;background:var(--lime);transform:rotate(-1.5deg)}
.auth-hero p{max-width:440px;font-size:18px;font-weight:600;opacity:.95;margin-top:22px}
.burst{position:absolute;right:56px;top:120px;width:70px;height:70px}
.burst i{position:absolute;width:10px;height:44px;border-radius:999px;background:var(--lime);transform-origin:bottom center}
.burst i:nth-child(1){left:20px;top:0;transform:rotate(28deg)}.burst i:nth-child(2){left:44px;top:20px;transform:rotate(62deg)}.burst i:nth-child(3){left:52px;top:52px;transform:rotate(92deg);height:34px}
.tierlist{display:flex;flex-direction:column;gap:12px;max-width:380px;position:relative;z-index:1}
.tierlist div{display:flex;justify-content:space-between;align-items:center;border:3px solid var(--lime);border-radius:28px;padding:12px 20px;background:#fff;color:var(--blue-ink);font-weight:800;box-shadow:var(--lift)}
.tierlist div span{font-weight:700;color:var(--blue-ink);opacity:.85}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:#fff}
.auth-card{width:100%;max-width:400px}
.auth-card h2{font-size:30px;color:var(--blue-ink)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:5px;border-radius:999px;margin:22px 0}
.tabs button{flex:1;border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:800;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--blue);color:#fff;box-shadow:var(--sh)}
.tabs button.on .muted{color:var(--lime)}
.hint{background:var(--lime-soft);border-radius:16px;padding:10px 14px;font-size:13px;margin-top:16px;color:var(--blue-ink)}

/* shell */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{background:var(--blue);color:#DDE2FF;padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.02em}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--lime);display:grid;place-items:center;font-style:normal;color:var(--blue-ink);font-weight:800}
.who{background:rgba(255,255,255,.1);border-radius:18px;padding:12px 14px}
.who b{color:#fff;display:block}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{all:unset;cursor:pointer;padding:10px 14px;border-radius:999px;font-weight:700;display:flex;justify-content:space-between;align-items:center;color:#E6E9FF}
.nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.nav button.on{background:var(--lime);color:var(--blue-ink);font-weight:800}
.nav .cnt{background:#fff;color:var(--blue-ink);font-size:11px;font-weight:800;border-radius:20px;padding:1px 8px}
.nav button.on .cnt{background:var(--blue);color:#fff}
.main{padding:30px 34px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:30px;color:var(--blue-ink);letter-spacing:-.03em}
.demo{background:var(--lime-soft);color:var(--blue-ink);padding:8px 14px;border-radius:999px;font-size:13px;margin-bottom:18px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line2);gap:10px;flex-wrap:wrap}
.card-h h3{font-size:16px;color:var(--blue-ink)}
.card-b{padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi:first-child{background:var(--blue);border-color:var(--blue);color:#fff}
.kpi:first-child .l,.kpi:first-child .s{color:#DDE2FF}.kpi:first-child .v{color:var(--lime)}
.kpi .l{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.03em;color:var(--blue-ink);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi:first-child a{color:var(--lime)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}

/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:800}
td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#F7F8FE}
td.r,th.r{text-align:right}
.empty{padding:36px;text-align:center;color:var(--muted)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* badges: pills */
.bd{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.bd.ok{background:var(--lime);color:var(--blue-ink)}.bd.warn{background:var(--warn-l);color:var(--warn)}.bd.err{background:var(--err-l);color:var(--err)}.bd.info{background:var(--info-l);color:var(--info)}.bd.grey{background:var(--line2);color:var(--muted)}
.bd.tier{background:var(--lime);color:var(--blue-ink)}
.bd.role{background:var(--lime);color:var(--blue-ink)}

/* shop */
.shop{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.pcard{padding:18px;display:flex;flex-direction:column;gap:6px}
.pcard:hover{border-color:var(--blue-action)}
.pcard h4{font-size:16px;line-height:1.3;color:var(--blue-ink)}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sku{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.prices{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.rrp{font-size:12.5px;color:var(--muted);text-decoration:line-through}
.yours{font-size:21px;font-weight:800;color:var(--blue);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pc-foot{margin-top:auto;padding-top:8px}
.stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:999px;overflow:hidden;width:max-content;background:#fff}
.stepper button{border:0;background:transparent;width:36px;height:34px;cursor:pointer;font-size:17px;font-weight:800;color:var(--blue-ink)}
.stepper button:hover{background:var(--lime)}
.stepper input{width:48px;border:0;text-align:center;font-weight:800;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.cart{position:sticky;top:20px}
.cline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ctot{display:flex;justify-content:space-between;font-weight:800;font-size:19px;padding:12px 0 4px;color:var(--blue-ink)}
.tierbar{display:flex;align-items:center;gap:12px;padding:12px 18px;margin-bottom:14px;background:var(--blue);color:#fff;border-radius:999px;font-weight:600}
.tierbar .muted{color:#DDE2FF}.tierbar b{color:var(--lime)}.tierbar .num{color:#fff}
.search{max-width:280px}

/* modal */
#modal-root .bg{position:fixed;inset:0;background:rgba(2,13,189,.35);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{background:var(--card);border-radius:28px;width:100%;max-width:540px;padding:26px 28px;box-shadow:0 24px 70px rgba(2,13,189,.3)}
.modal h3{font-size:22px;margin-bottom:14px;color:var(--blue-ink)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.paytotal{display:flex;justify-content:space-between;align-items:center;background:var(--blue);color:#fff;border-radius:20px;padding:16px 20px;margin-bottom:14px;font-weight:700}
.paytotal b{font-size:26px;color:var(--lime);font-variant-numeric:tabular-nums}
.pm{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pmopt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:18px;padding:11px 14px;cursor:pointer;background:#fff}
.pmopt b{color:var(--blue-ink)}
.pmopt:has(input:checked){border-color:var(--lime);box-shadow:0 0 0 3px var(--lime-soft)}
.pmopt small{display:block;color:var(--muted)}
.bankbox{background:var(--bg);border-radius:16px;padding:12px 16px;margin-bottom:12px;font-size:13.5px}
.bankbox div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.qr{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.sim{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.items td{padding:8px 6px}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.t{background:var(--blue-ink);color:#fff;padding:11px 20px;border-radius:999px;box-shadow:var(--lift);font-weight:700;max-width:90vw}
.t.err{background:var(--err)}

.loading{min-height:100vh;display:grid;place-items:center;text-align:center;background:var(--blue);color:#fff}
.spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.25);border-top-color:var(--lime);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}

@media (max-width:980px){
  .shop,.cols{grid-template-columns:1fr}
  .cart{position:static}
}
@media (max-width:820px){
  .auth{grid-template-columns:1fr}.auth-hero{padding:32px 24px}.auth-hero h1{font-size:34px}.tierlist,.burst{display:none}
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{min-width:0}
  .side{position:static;height:auto;padding:14px;gap:12px}
  .nav{flex:none;flex-direction:row;align-items:center;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav button{flex:none;white-space:nowrap}
  .who .btn{margin-top:0!important}
  .who{display:flex;justify-content:space-between;align-items:center}
  .main{padding:20px 16px 50px}
  .grid2{grid-template-columns:1fr}
  .tierbar{border-radius:20px;flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
/* ================= configuration ================= */
const SB_URL = 'https://ukvdfhuecqtbsgdyzvcq.supabase.co';
const SB_KEY = 'sb_publishable_EBU24KkgacFm2xrbQWeCFg_gl5Av6fq'; // publishable key: safe in the browser, data is protected by row-level security
const AGENT_DOMAIN = 'agents.resellerhub.invalid';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM = n => 'RM ' + (Number(n) || 0).toLocaleString('en-MY', {minimumFractionDigits:2, maximumFractionDigits:2});
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const int = v => Math.max(0, parseInt(v, 10) || 0);
const now = () => new Date().toISOString();
const fdate = iso => iso ? new Date(iso).toLocaleString('en-MY', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';
const fday = iso => iso ? new Date(iso).toLocaleDateString('en-MY', {day:'2-digit', month:'short', year:'numeric'}) : '—';
const thisMonth = iso => { if (!iso) return false; const d = new Date(iso), n = new Date(); return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear(); };
const errMsg = e => {
  if (!e) return 'Something went wrong.';
  if (e.code === '23505') return /sku/i.test(e.message || '') ? 'Another product already uses that SKU.' : 'That value is already in use.';
  if (e.code === '23503') return 'This is still in use, so it can\'t be removed.';
  if (/Failed to fetch|NetworkError/i.test(e.message || '')) return 'Can\'t reach the server. Check your connection.';
  return e.message || e.error_description || 'Something went wrong.';
};

/* ================= state & data ================= */
const COLLS = ['products', 'users', 'orders', 'sales', 'inventory', 'config'];
const C = {}; const clearData = () => COLLS.forEach(c => C[c] = {}); clearData();
const S = { mode:'loading', fatal:null, pub:{company:'ResellerHub', hasAdmin:true, tiers:[]}, me:null, authEmail:null, view:'dashboard', cart:{}, q:'', authTab:'login', ofilter:'all', pending:null };

const DEFAULT_SETTINGS = { companyName:'ResellerHub HQ', bankName:'', accountName:'', accountNo:'', defaultCommission:10, lowStock:20 };
const settings = () => C.config.settings || {...DEFAULT_SETTINGS, companyName: S.pub.company};
const tiers = () => (C.config.tiers && C.config.tiers.length) ? C.config.tiers : (S.pub.tiers.length ? S.pub.tiers : [{id:'standard', name:'Standard', discount:0}]);
const tierOf = id => tiers().find(t => t.id === id) || tiers()[tiers().length - 1];
const priceFor = (p, tierId) => r2((p.rrp || 0) * (1 - (tierOf(tierId).discount || 0) / 100));
const list = coll => Object.entries(C[coll]).map(([id, v]) => ({id, ...v}));
const users = () => list('users');
const products = () => list('products').sort((a, b) => String(a.name).localeCompare(String(b.name)));
const orders = () => list('orders').sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
const sales = () => list('sales').sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
const inv = rid => (C.inventory[rid] && C.inventory[rid].items) || {};
const me = () => (S.me && C.users[S.me]) ? {id:S.me, ...C.users[S.me]} : null;
const uname = id => (C.users[id] && (C.users[id].business || C.users[id].name)) || '—';
const onBrandPage = () => location.pathname.replace(/\/+$/, '') === '/brand' || location.hash === '#brand';
const isAdm = r => r === 'admin' || r === 'superadmin';
const handle = u => u.role === 'agent' ? '@' + (u.username || '') : (u.email || '');
const lowStock = () => Number(settings().lowStock) || 0;

async function loadAll(){
  const res = await Promise.all([
    sb.from('settings').select('*').eq('id', 1).maybeSingle(),
    sb.from('tiers').select('*').order('sort').order('discount', {ascending:false}),
    sb.from('products').select('*'),
    sb.from('profiles').select('*'),
    sb.from('inventory').select('*'),
    sb.from('orders').select('*, order_items(*)').order('created_at', {ascending:false}).limit(1000),
    sb.from('sales').select('*').order('created_at', {ascending:false}).limit(5000),
  ]);
  const bad = res.find(r => r.error); if (bad) throw bad.error;
  const [st, ti, pr, pf, iv, od, sa] = res.map(r => r.data);
  clearData();
  if (st) C.config.settings = { companyName: st.company_name, bankName: st.bank_name, accountName: st.account_name, accountNo: st.account_no, defaultCommission: Number(st.default_commission), lowStock: st.low_stock, address: st.address || '', postcode: st.postcode || '', city: st.city || '', state: st.state || '', phone: st.phone || '' };
  C.config.tiers = (ti || []).map(t => ({id:t.id, name:t.name, discount:Number(t.discount), sort:t.sort}));
  (pr || []).forEach(p => C.products[p.id] = {sku:p.sku, name:p.name, category:p.category, rrp:Number(p.rrp), hqStock:p.hq_stock, active:p.active, weightKg: p.weight_kg == null ? null : Number(p.weight_kg), createdAt:p.created_at});
  (pf || []).forEach(u => C.users[u.id] = {role:u.role, status:u.status, name:u.name, business:u.business, phone:u.phone, email:u.email, state:u.state, address:u.address, postcode:u.postcode, city:u.city, companyReg:u.company_reg, username:u.username, tier:u.tier, parentId:u.parent_id, commission: u.commission == null ? null : Number(u.commission), createdAt:u.created_at});
  (iv || []).forEach(i => { (C.inventory[i.reseller_id] = C.inventory[i.reseller_id] || {items:{}}).items[i.product_id] = i.qty; });
  (od || []).forEach(o => C.orders[o.id] = {number:o.number, resellerId:o.reseller_id, total:Number(o.total), status:o.status, createdAt:o.created_at, rejectReason:o.reject_reason,
    items:(o.order_items || []).map(i => ({productId:i.product_id, name:i.name, qty:i.qty, unitPrice:Number(i.unit_price)})),
    awbNo:o.awb_no, shipName:o.ship_name, shipPhone:o.ship_phone, shipAddress:o.ship_address, shipPostcode:o.ship_postcode, shipCity:o.ship_city, shipState:o.ship_state,
    payment: o.payment_method ? {method:o.payment_method, bank:o.payment_bank, ref:o.payment_ref, paidAt:o.paid_at} : null});

async function refresh(){
  try { await loadAll(); } catch(e) { return; }
  const blocked = accessProblem(S.me);
  if (blocked) { toast(blocked, 'err'); await signOut(); return; }
  render();
}
function accessProblem(uid){
  const p = C.users[uid];
  if (!p) return 'This account doesn\'t have access to the system.';
  if (p.status === 'pending') return p.role === 'admin' ? 'Your brand owner application is still waiting for approval.' : 'Your application is still waiting for HQ approval.';
  if (p.status !== 'active') return 'This account is suspended. Please contact HQ.';
  if (p.role === 'agent' && (!C.users[p.parentId] || C.users[p.parentId].status !== 'active')) return 'Your reseller\'s account is inactive. Please contact them.';
  return null;
}
async function enter(user){
  S.authEmail = user.email;
  try { await loadAll(); } catch(e) { toast(errMsg(e), 'err'); }
  const blocked = accessProblem(user.id);
  if (blocked) { toast(blocked, 'err'); await signOut(); return false; }
  S.me = user.id; S.view = 'dashboard'; return true;
}
async function signOut(){ try { await sb.auth.signOut(); } catch(e) {} S.me = null; S.authEmail = null; S.cart = {}; S.q = ''; clearData(); S.view = 'dashboard'; await loadPublic(); render(); }
async function loadPublic(){
  const {data, error} = await sb.rpc('get_public_info');
  if (error) throw error;
  S.pub = {company: data.company_name, hasAdmin: data.has_admin, tiers: (data.tiers || []).map(t => ({...t, discount:Number(t.discount)}))};
}

// Run a server call, then reload data. Returns the result, or null on failure (after showing the error).
async function call(fn, okMsg){
  try {
    const r = await fn();
    if (r && r.error) throw r.error;
    await refresh();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r && r.data) : okMsg);
    return (r && r.data != null) ? r.data : true;
  } catch(e) { toast(errMsg(e), 'err'); return null; }
}
async function accounts(body){
  const {data, error} = await sb.functions.invoke('accounts', {body});
  if (error) { let m = error.message; try { const j = await error.context.json(); if (j && j.error) m = j.error; } catch(_) {} throw new Error(m); }
  if (data && data.error) throw new Error(data.error);
  return {data};
}

/* ================= boot ================= */
async function boot(){
  render();
  try { await loadPublic(); }
  catch(e) { S.fatal = 'Can\'t reach the server right now. Check your internet connection and reload the page.'; render(); return; }
  const {data:{session}} = await sb.auth.getSession();
  if (session) await enter(session.user);
  S.mode = 'ready'; render();
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.me) { S.me = null; clearData(); render(); } });
  setInterval(() => { if (S.me && document.visibilityState === 'visible' && !$('#modal-root').innerHTML) refresh(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (S.me && document.visibilityState === 'visible') refresh(); });
}

let lastHtml = '';
function render(){
  const app = $('#app');
  const ae = document.activeElement;
  const fid = ae && ae.id && app.contains(ae) ? ae.id : null;
  let caret = null; try { caret = fid ? ae.selectionStart : null; } catch(e) {}
  const html = build();
  if (html === lastHtml) return;
  lastHtml = html; app.innerHTML = html;
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (caret != null) el.setSelectionRange(caret, caret); } catch(e) {} } }
}
function build(){
  if (S.fatal) return `<div class="loading"><div><b>${esc(S.fatal)}</b><p><button class="btn" onclick="location.reload()">Reload</button></p></div></div>`;
  if (S.mode === 'loading') return `<div class="loading"><div><div class="spin"></div><b>Loading…</b></div></div>`;
  if (!S.pub.hasAdmin && !S.me) return setupView();
  const u = me();
  if (!u) return onBrandPage() ? brandView() : authView();
  return shell(u);
}

const NAV = {

  superadmin:[['dashboard','Dashboard'],['orders','Orders & payments'],['products','Products & stock'],['resellers','Resellers'],['agents','Agents'],['sales','Sales'],['admins','HQ admins'],['settings','Settings'],['profile','Profile']],

function shell(u){
  const nav = NAV[u.role] || [];
  if (!nav.some(n => n[0] === S.view)) S.view = 'dashboard';
  const counts = {};
  if (isAdm(u.role)) {

    counts.resellers = users().filter(x => x.role === 'reseller' && x.status === 'pending').length;
    if (u.role === 'superadmin') counts.admins = users().filter(x => x.role === 'admin' && x.status === 'pending').length;
  }
  if (u.role === 'reseller') counts.myorders = orders().filter(o => o.resellerId === u.id && o.status === 'awaiting_payment').length;
  const sub = u.role === 'reseller' ? badge('tier', tierOf(u.tier).name + ' reseller') : u.role === 'agent' ? `<span class="sm">Agent of ${esc(uname(u.parentId))}</span>` : badge('role', u.role === 'superadmin' ? 'System admin' : 'HQ admin');

function qrSvg(seed){
  let h = 0; for (const c of seed) h = (h * 131 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h * 1103515245 + 12345) >>> 0) / 4294967296;
  const n = 21; let r = '';
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#13212d"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#13212d"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const inF = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12); if (!inF && rnd() > .52) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="#13212d"/>`; }
  return `<svg viewBox="-1 -1 23 23" width="112" height="112" style="background:#fff;border-radius:8px;border:1px solid var(--line)">${r}${finder(0, 0)}${finder(14, 0)}${finder(0, 14)}</svg>`;
}

// Code 128 (set B) barcode as SVG
const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128Svg(text, heightMm, widthMm){
  const vals = [104];
  for (const ch of String(text)) { const v = ch.charCodeAt(0) - 32; if (v < 0 || v > 94) continue; vals.push(v); }
  let sum = 104; for (let i = 1; i < vals.length; i++) sum += i * vals[i];
  vals.push(sum % 103); vals.push(106);
  const widths = vals.map(v => C128[v]).join('');
  const quiet = 10; let total = quiet * 2; for (const w of widths) total += +w;
  let x = quiet, bars = '';
  for (let i = 0; i < widths.length; i++) { const w = +widths[i]; if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="100"/>`; x += w; }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} 100" preserveAspectRatio="none" style="width:${widthMm}mm;height:${heightMm}mm;display:block">${bars}</svg>`;
}

function awbData(kind, id){
  const st = settings();
  if (kind === 'order') {
    const o = C.orders[id]; if (!o) return null;
    const units = (o.items || []).reduce((s, i) => s + i.qty, 0);
    const kg = (o.items || []).reduce((s, i) => s + i.qty * ((C.products[i.productId] || {}).weightKg || 0), 0);
    return { awb:o.awbNo, ref:o.number, date:o.createdAt, pieces:1, units, kg, cod:0,
      contents:(o.items || []).map(i => `${i.name} ×${i.qty}`).join(', '),
      from:{name:st.companyName, phone:st.phone, address:st.address, postcode:st.postcode, city:st.city, state:st.state},
      to:{name:o.shipName, phone:o.shipPhone, address:o.shipAddress, postcode:o.shipPostcode, city:o.shipCity, state:o.shipState} };
  }
  const s = C.sales[id]; if (!s) return null;
  const r = C.users[s.resellerId] || {}; const seller = C.users[s.sellerId] || {};
  const kg = s.qty * ((C.products[s.productId] || {}).weightKg || 0);
  return { awb:s.awbNo, ref:'Sale ' + id.slice(0, 8).toUpperCase() + (s.sellerRole === 'agent' ? ' · Agent ' + (seller.name || '') : ''), date:s.createdAt, pieces:1, units:s.qty, kg,
    cod: s.cod ? s.total : 0, contents:`${s.productName} ×${s.qty}`,
    from:{name:r.business || r.name || '', phone:r.phone, address:r.address, postcode:r.postcode, city:r.city, state:r.state},
    to:{name:s.customer, phone:s.customerPhone, address:s.shipAddress, postcode:s.shipPostcode, city:s.shipCity, state:s.shipState} };
}

}

function printAwb(kind, id){
  const d = awbData(kind, id);
  if (!d || !d.awb) { toast('This record has no airway bill.', 'err'); return; }
  let f = document.getElementById('awbFrame');
  if (f) f.remove();
  f = document.createElement('iframe');
  f.id = 'awbFrame';
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  const doc = f.contentWindow.document;
  doc.open(); doc.write(awbHtml(d)); doc.close();
  setTimeout(() => { if (!f.isConnected || !f.contentWindow) return; try { f.contentWindow.focus(); f.contentWindow.print(); } catch(e) { toast('Your browser blocked printing. Try again.', 'err'); } }, 250);
}

/* ================= toast ================= */
function toast(msg, kind){ const el = document.createElement('div'); el.className = 't ' + (kind || ''); el.textContent = msg; $('#toast').appendChild(el); setTimeout(() => el.remove(), kind === 'err' ? 5500 : 3200); }

/* ================= actions ================= */
const setUserStatus = (id, status, msg) => {
  const u = C.users[id];
  return u.role === 'agent'
    ? call(() => sb.rpc('update_agent', {p_agent:id, p_name:null, p_phone:null, p_commission:null, p_status:status}), msg)
    : call(() => sb.from('profiles').update({status}).eq('id', id), msg);
};
const ACT = {
  authTab: id => { S.authTab = id; render(); },
  logout: () => signOut(),
  nav: id => { S.view = id; S.q = ''; render(); window.scrollTo(0, 0); },
  close: closeModal,
  bgclose: (id, el, e) => { if (e.target === el) closeModal(); },
  confirmYes: () => { const fn = S.pending; const reason = ($('#cf_reason') || {}).value; closeModal(); if (fn) fn(reason); },
  ofilter: id => { S.ofilter = id; render(); },
  newProduct: () => productModal(),
  editProduct: id => productModal(id),
  restock: id => restockModal(id),
  newUser: role => { if (role === 'agent' && isAdm(me().role) && !users().some(x => x.role === 'reseller' && x.status === 'active')) { toast('Approve a reseller first.', 'err'); return; } userModal(role); },
  editUser: id => userModal(null, id),
  newAdmin: () => adminModal(),
  copyBrandLink: async () => { try { await navigator.clipboard.writeText(location.origin + '/brand'); toast('Link copied.'); } catch(e) { toast('Copy failed. Select the link and copy it manually.', 'err'); } },
  editAdmin: id => adminModal(id),
  approveUser: id => setUserStatus(id, 'active', (C.users[id].name || 'Account') + ' is now active.'),
  suspendUser: id => {
    const u = C.users[id]; const pend = u.status === 'pending';
    confirmBox(pend ? 'Decline application?' : 'Suspend ' + u.name + '?', pend ? 'The applicant won\'t be able to sign in.' : 'They won\'t be able to sign in until reactivated.' + (u.role === 'reseller' ? ' Their agents will also be blocked.' : ''), pend ? 'Decline' : 'Suspend',
      () => setUserStatus(id, 'suspended', pend ? 'Application declined.' : 'Account suspended.'), true);
  },
  newSale: id => saleModal(id),
  awbOrder: id => printAwb('order', id),
  awbSale: id => printAwb('sale', id),
  viewOrder: id => orderModal(id),
  pay: id => payModal(id),
  cancelOrder: id => confirmBox('Cancel ' + C.orders[id].number + '?', 'This order hasn\'t been paid. Cancelling removes it from HQ\'s queue.', 'Cancel order', () => call(() => sb.rpc('cancel_order', {p_order:id}), 'Order cancelled.'), true),
  rejectOrder: id => confirmBox('Reject payment for ' + C.orders[id].number + '?', 'No stock will be released. The reseller will see the reason.', 'Reject', reason => call(() => sb.rpc('reject_order', {p_order:id, p_reason:reason || ''}), 'Order rejected.'), true, true),
  approveOrder: async (id, el) => { if (el) el.disabled = true; const rn = uname(C.orders[id].resellerId); const r = await call(() => sb.rpc('approve_order', {p_order:id}), 'Payment verified. Stock released to ' + rn + '.'); if (r == null && el) el.disabled = false; },
  cartInc: id => { const p = C.products[id]; S.cart[id] = Math.min((S.cart[id] || 0) + 1, p.hqStock || 0); render(); },
  cartDec: id => { S.cart[id] = Math.max((S.cart[id] || 0) - 1, 0); render(); },
  cartClear: () => { S.cart = {}; render(); },
  placeOrder: async (id, el) => {
    const lines = Object.entries(S.cart).filter(([pid, n]) => n > 0 && C.products[pid]);
    if (!lines.length) return;
    if (el) el.disabled = true;
    const oid = await call(() => sb.rpc('place_order', {p_items: lines.map(([pid, n]) => ({product_id:pid, qty:n}))}));
    if (el) el.disabled = false;
    if (!oid) return;
    S.cart = {}; S.view = 'myorders'; render(); payModal(oid);
  },
  addTier: () => openModal(`<h3>Add tier</h3><form data-form="tier"><div class="grid2"><label class="f"><span>Tier name</span><input class="in" name="name" required placeholder="e.g. Diamond"></label><label class="f"><span>Discount %</span><input class="in" name="discount" type="number" min="0" max="90" step="0.5" required></label></div><div class="mfoot"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn primary">Add tier</button></div></form>`),
  delTier: id => {
    if (users().some(u => u.role === 'reseller' && u.tier === id)) { toast('Move resellers off this tier before removing it.', 'err'); return; }
    confirmBox('Remove ' + tierOf(id).name + ' tier?', 'Any unsaved changes on this page will be lost.', 'Remove', () => call(() => sb.from('tiers').delete().eq('id', id), 'Tier removed.'), true);
  },
};

const CHG = {
  tier: (id, el) => { const u = C.users[id]; call(() => sb.from('profiles').update({tier: el.value}).eq('id', id), `${u.business || u.name} moved to ${tierOf(el.value).name}.`); },
  pm: (id, el) => { const m = el.value; document.querySelectorAll('.pmsec').forEach(s => s.hidden = s.dataset.pm !== m); $('#refWrap').hidden = m === 'fpx'; $('#refWrap input').required = m !== 'fpx'; },
  saleDelivery: (id, el) => { const c = el.value === 'courier'; $('#shipBox').hidden = !c; ['#saleCust', '#salePhone'].forEach(q => $(q).required = c); document.querySelectorAll('#shipBox [name=address], #shipBox [name=postcode]').forEach(i => i.required = c); },
  saleProduct: (id, el) => { const p = C.products[el.value]; if (p) $('#salePrice').value = p.rrp; },
};
const INP = {
  q: (id, el) => { S.q = el.value; render(); },
  cartQty: (id, el) => { const p = C.products[id]; S.cart[id] = Math.min(int(el.value), p.hqStock || 0); render(); },
};

const ok = r => r == null ? false : undefined; // keep modal open when a call failed

const FORMS = {
  async setup(f){
    try { await accounts({action:'setup_admin', company:f.company, name:f.name, email:f.email, password:f.password}); }
    catch(e) { toast(errMsg(e), 'err'); await loadPublic().catch(() => {}); render(); return false; }
    const {data, error} = await sb.auth.signInWithPassword({email: f.email.trim().toLowerCase(), password: f.password});
    if (error) { toast(errMsg(error), 'err'); return false; }
    await loadPublic(); await enter(data.user); render();
    toast('HQ admin created. Add your products next.');
  },
  async login(f){
    const id = f.id.trim().toLowerCase();
    const email = id.includes('@') ? id : `${id}@${AGENT_DOMAIN}`;
    const {data, error} = await sb.auth.signInWithPassword({email, password: f.password});
    if (error) { toast(/invalid/i.test(error.message) ? 'Wrong email/username or password.' : errMsg(error), 'err'); return false; }
    await enter(data.user); render();
  },
  async brand(f){
    try { await accounts({action:'apply_brand_owner', ...f}); }
    catch(e) { toast(errMsg(e), 'err'); return false; }
    S.brandDone = f.name.trim().split(' ')[0]; render();
  },
  async register(f){
    try { await accounts({action:'apply_reseller', ...f}); }
    catch(e) { toast(errMsg(e), 'err'); return false; }
    S.authTab = 'login'; render(); toast('Application sent. HQ will review it, then you can sign in with your email.');
  },
  async product(f){
    const row = {name: f.name.trim(), sku: f.sku.trim().toUpperCase(), category: f.category.trim() || null, rrp: r2(f.rrp), weight_kg: f.weightKg === '' ? null : Number(f.weightKg), active: !!f.active};
    if (f.id) return ok(await call(() => sb.from('products').update(row).eq('id', f.id), 'Product updated.'));
    return ok(await call(() => sb.from('products').insert({...row, hq_stock: int(f.hqStock)}), 'Product added.'));
  },
  async restock(f){ return ok(await call(() => sb.rpc('restock', {p_product: f.id, p_qty: int(f.qty)}), v => `Added ${int(f.qty)} units. HQ stock is now ${v}.`)); },
  async user(f){
    const viewer = me(); const isNew = !f.id;
    if (isNew) {
      const body = f.role === 'agent'
        ? {action:'create_agent', name:f.name, username:f.username, email:f.email, phone:f.phone, commission:Number(f.commission), password:f.password, parent_id:f.parent_id}
        : {action:'create_reseller', name:f.name, business:f.business, email:f.email, phone:f.phone, state:f.state, tier:f.tier, password:f.password};
      return ok(await call(() => accounts(body), f.role === 'agent' ? `${f.name} registered. They sign in with username "${f.username.trim().toLowerCase()}".` : `${f.name} registered and active.`));
    }
    let r = f.role === 'agent'
      ? await call(() => sb.rpc('update_agent', {p_agent:f.id, p_name:f.name, p_phone:f.phone || '', p_commission:Number(f.commission), p_status:null}))
      : await call(() => sb.from('profiles').update({name:f.name.trim(), business:(f.business || '').trim() || null, phone:(f.phone || '').trim(), state:(f.state || '').trim() || null, address:(f.address || '').trim() || null, postcode:(f.postcode || '').trim() || null, city:(f.city || '').trim() || null, tier:f.tier}).eq('id', f.id));
    if (r == null) return false;
    if (f.password) { r = await call(() => accounts({action:'reset_password', user_id:f.id, password:f.password})); if (r == null) return false; }
    toast(f.password ? 'Saved, and the password was reset.' : 'Saved.');
  },
  async admin(f){
    if (!f.id) return ok(await call(() => accounts({action:'create_admin', name:f.name, phone:f.phone, email:f.email, password:f.password, business:f.business, company_reg:f.company_reg}), `${f.name} added as HQ admin.`));
    let r = await call(() => sb.from('profiles').update({name:f.name.trim(), phone:(f.phone || '').trim(), business:(f.business || '').trim() || null, company_reg:(f.company_reg || '').trim() || null}).eq('id', f.id));
    if (r == null) return false;
    if (f.password) { r = await call(() => accounts({action:'reset_password', user_id:f.id, password:f.password})); if (r == null) return false; }
    toast(f.password ? 'Saved, and the password was reset.' : 'Saved.');
  },
  async sale(f){
    const courier = f.delivery === 'courier';
    if (courier && !((f.customer || '').trim() && (f.customerPhone || '').trim() && (f.address || '').trim() && (f.postcode || '').trim())) { toast('For courier delivery, enter the customer\'s name, phone, address and postcode.', 'err'); return false; }
    const a = addrOf(f);
    const res = await call(() => sb.rpc('record_sale', {p_product:f.productId, p_qty:int(f.qty), p_price:r2(f.price), p_customer:f.customer, p_phone:f.customerPhone,
      p_delivery: courier ? 'courier' : 'walkin', p_cod: courier && !!f.cod, p_address:a.address, p_postcode:a.postcode, p_city:a.city, p_state:a.state}));
    if (res == null) return false;
    const s = C.sales[res]; toast(s ? `Sale recorded: ${RM(s.total)}${s.commission ? ' · commission ' + RM(s.commission) : ''}` : 'Sale recorded.');
    if (courier && s && s.awbNo) setTimeout(() => printAwb('sale', res), 300);
  },
  async pay(f, form){
    if (f.method !== 'fpx' && !(f.ref || '').trim()) { toast('Enter the transaction reference from your receipt.', 'err'); return false; }
    if (f.method === 'fpx') { const b = form.querySelector('#payBtn'); b.textContent = 'Connecting to ' + f.bank + '…'; await new Promise(r => setTimeout(r, 1200)); }
    return ok(await call(() => sb.rpc('submit_payment', {p_order:f.orderId, p_method:f.method, p_bank:f.bank || null, p_ref:f.ref || null}), 'Payment submitted. HQ will verify it and release your stock.'));
  },
  async profile(f){
    const a = addrOf(f);
    await call(() => sb.rpc('update_my_profile', {p_name:f.name, p_phone:f.phone || '', p_business:f.business || '',
      p_address: f.address == null ? null : (a.address || ''), p_postcode: f.postcode == null ? null : (a.postcode || ''), p_city: f.city == null ? null : (a.city || ''), p_state: f.state == null ? null : (a.state || '')}), 'Details saved.');
    return false;
  },
  async password(f, form){
    const {error} = await sb.auth.signInWithPassword({email: S.authEmail, password: f.cur});
    if (error) { toast('Current password is wrong.', 'err'); return false; }
    const r = await sb.auth.updateUser({password: f.pw});
    if (r.error) { toast(errMsg(r.error), 'err'); return false; }
    form.reset(); toast('Password updated.'); return false;
  },
  async settings(f){
    const r = await call(async () => {
      const a = await sb.from('settings').update({company_name:f.companyName.trim(), bank_name:f.bankName.trim(), account_no:f.accountNo.trim(), account_name:f.accountName.trim(), default_commission:Number(f.defaultCommission) || 0, low_stock:int(f.lowStock), phone:(f.phone || '').trim(), address:(f.address || '').trim(), postcode:(f.postcode || '').trim(), city:(f.city || '').trim(), state:(f.state || '').trim()}).eq('id', 1);
      if (a.error) return a;
      const ts = tiers().map((t, i) => ({id:t.id, name:(f['tn_' + i] || t.name).trim(), discount:Math.min(90, Math.max(0, Number(f['td_' + i]) || 0))}))
        .sort((x, y) => y.discount - x.discount).map((t, i) => ({...t, sort:i + 1}));
      return sb.from('tiers').upsert(ts);
    }, 'Settings saved.');
    return false;
  },
  async tier(f){
    const name = f.name.trim(); let id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'tier';
    if (tiers().some(t => t.id === id)) id += '-' + Math.random().toString(36).slice(2, 5);
    const ts = [...tiers(), {id, name, discount:Math.min(90, Math.max(0, Number(f.discount) || 0))}].sort((a, b) => b.discount - a.discount).map((t, i) => ({id:t.id, name:t.name, discount:t.discount, sort:i + 1}));
    return ok(await call(() => sb.from('tiers').upsert(ts), name + ' tier added.'));
  },
};

/* ================= events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'bgclose') { fn(el.dataset.id, el, e); return; }
  e.preventDefault(); fn(el.dataset.id, el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el.dataset.id, el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el.dataset.id, el); });
document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const fd = new FormData(form); const f = {}; fd.forEach((v, k) => f[k] = typeof v === 'string' ? v : '');
  const fn = FORMS[form.dataset.form]; if (!fn) return;
  const btn = form.querySelector('button:not([type=button])'); const label = btn && btn.textContent;
  if (btn) btn.disabled = true;
  let res;
  try { res = await fn(f, form); } catch(err) { console.error(err); toast(errMsg(err), 'err'); res = false; }
  if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = label; }
  if (res !== false && form.closest('#modal-root')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });

boot();
</script>
